</style>
</head>

// ═══ STATE ═══
let currentBab='all', searchQ='', activeFilter='all';

// ═══ INIT ═══
const babScroller = document.getElementById('babScroller');
const babKeys = Object.keys(allBabs).map(Number).sort((a,b)=>a-b);
babKeys.forEach(b=>{
  const btn=document.createElement('button');
  btn.className='bab-btn';
  btn.textContent=b;
  btn.id='bab'+b;
  btn.onclick=()=>selectBab(b);
  babScroller.appendChild(btn);
});

function selectBab(b){
  currentBab=b;
  document.getElementById('babAll').classList.toggle('active',b==='all');
  babKeys.forEach(k=>{
    const el=document.getElementById('bab'+k);
    if(el)el.classList.toggle('active',k===b);
  });
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function onSearch(v){searchQ=v.trim().toLowerCase();render();}

function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.filter-pill').forEach(p=>{
    p.classList.toggle('active',p.dataset.filter===f);
  });
  render();
}

function toggleTheme(){
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;
  document.querySelector('.theme-btn').textContent=t==='dark'?'☀️':'🌙';
}

function hl(text){
  if(!searchQ)return text;
  const re=new RegExp('('+searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return String(text).replace(re,'<mark>$1</mark>');
}

function matchRow(r){
  if(!searchQ)return true;
  const q=searchQ.toLowerCase();
  return r.jp.includes(q)||r.rom.toLowerCase().includes(q)||r.meaning.toLowerCase().includes(q)||r.kanji.toLowerCase().includes(q)||(r.note&&r.note.toLowerCase().includes(q));
}

const typeLabel={verb:'動詞',adj:'形容詞',noun:'名詞',expr:'表現',place:'場所'};

function getBabsToRender(){
  if(currentBab==='all') return babKeys.map(k=>({bab:k,sections:allBabs[k]}));
  if(allBabs[currentBab]) return [{bab:currentBab,sections:allBabs[currentBab]}];
  return [];
}

function render(){
  const container=document.getElementById('vocabSections');
  const empty=document.getElementById('emptyVocab');
  const babs=getBabsToRender();
  let total=0;
  const parts=[];
  babs.forEach(({bab,sections})=>{
    sections.forEach(sec=>{
      const rows=sec.rows.filter(r=>{
        const typeOk=activeFilter==='all'||r.type===activeFilter;
        return typeOk&&matchRow(r);
      });
      if(!rows.length)return;
      total+=rows.length;
      const tl=typeLabel;
      const tableRows=rows.map((r,i)=>`<tr class="vocab-row">
        <td class="td-num">${String(i+1).padStart(2,'0')}</td>
        <td class="td-jp">
          <div class="jp-word">${hl(r.jp)}</div>
          <div class="jp-rom">${hl(r.rom)}</div>
          ${r.note?`<div class="jp-note-text">${r.note}</div>`:''}
        </td>
        <td class="td-kanji">${r.kanji&&r.kanji!=='—'?hl(r.kanji):'<span style="color:var(--text4)">—</span>'}</td>
        <td class="td-meaning">${hl(r.meaning)}</td>
        <td class="td-type"><span class="type-badge type-${r.type}">${tl[r.type]||r.type}</span></td>
      </tr>`).join('');
      const cardRows=rows.map((r,i)=>`<div class="vocab-card">
        <div class="vc-left">
          <div class="vc-jp-word">${hl(r.jp)}</div>
          <div class="vc-rom">${hl(r.rom)}</div>
          ${r.note?`<div class="vc-note">${r.note}</div>`:''}
        </div>
        <div class="vc-right">
          ${r.kanji&&r.kanji!=='—'?`<div class="vc-kanji">${hl(r.kanji)}</div>`:''}
          <div class="vc-meaning">${hl(r.meaning)}</div>
          <div class="vc-badge-row">
            <span class="vc-num">${String(i+1).padStart(2,'0')}</span>
            <span class="type-badge type-${r.type}">${tl[r.type]||r.type}</span>
          </div>
        </div>
      </div>`).join('');
      parts.push(`<div class="section">
        <div class="section-card">
          <div class="section-head">
            <span class="section-tag">${sec.num} — 第${bab}課</span>
            <span class="section-name">${sec.title}</span>
            <span class="section-jp-label">${sec.jp}</span>
          </div>
          <div class="vocab-table-wrap">
            <table class="vocab-table">
              <thead><tr>
                <th style="width:30px"></th>
                <th>Hiragana / Katakana</th>
                <th>Kanji</th>
                <th>Arti Bahasa Indonesia</th>
                <th style="width:68px">Tipe</th>
              </tr></thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
          <div class="vocab-cards-wrap">${cardRows}</div>
        </div>
      </div>`);
    });
  });
  container.innerHTML=parts.join('');
  document.getElementById('count').textContent=total+' kata';
  empty.style.display=total===0?'block':'none';
}

render();
</script>
